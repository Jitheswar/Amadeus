# Fan curve for Intel Macs with a T2 chip, read by t2fanrd. A section for a fan the
# machine does not have is ignored, so Fan2 is harmless on single-fan models.
[Fan1]
low_temp=55
high_temp=75
speed_curve=linear
always_full_speed=false

[Fan2]
low_temp=55
high_temp=75
speed_curve=linear
always_full_speed=false
