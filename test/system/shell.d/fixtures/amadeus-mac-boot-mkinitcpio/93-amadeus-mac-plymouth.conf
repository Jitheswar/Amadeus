# Plymouth draws the disk password prompt and the boot splash, as on x86
# Amadeus. It goes right after systemd so its initrd units order correctly,
# only when the hook is installed, and never twice.
if [[ -f /usr/lib/initcpio/install/plymouth && " ${HOOKS[*]} " != *" plymouth "* ]]; then
  _amadeus_mac_plymouth_hooks=()
  _amadeus_mac_plymouth_added=false
  for _amadeus_mac_plymouth_hook in "${HOOKS[@]}"; do
    _amadeus_mac_plymouth_hooks+=("$_amadeus_mac_plymouth_hook")
    if [[ $_amadeus_mac_plymouth_hook == systemd && $_amadeus_mac_plymouth_added == false ]]; then
      _amadeus_mac_plymouth_hooks+=(plymouth)
      _amadeus_mac_plymouth_added=true
    fi
  done
  if [[ $_amadeus_mac_plymouth_added == true ]]; then
    HOOKS=("${_amadeus_mac_plymouth_hooks[@]}")
  fi
  unset _amadeus_mac_plymouth_hooks _amadeus_mac_plymouth_added _amadeus_mac_plymouth_hook
fi
