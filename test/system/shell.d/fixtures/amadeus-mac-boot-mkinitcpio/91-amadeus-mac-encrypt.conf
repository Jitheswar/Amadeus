# Insert amadeus-mac-encrypt after vendorfw/block and sd-encrypt immediately
# before filesystems, each only if that hook is absent. 90-amadeus-mac.conf
# already put asahi and amadeus-vendorfw before filesystems; this drop-in is
# sourced after it.
#
# Both are systemd initrd units: the systemd hook replaces udev (mkinitcpio's
# stock HOOKS line) and keymap/consolefont become sd-vconsole. A HOOKS line
# carrying the busybox encrypt hook belongs to a Mac unlocked by cryptdevice=,
# which sd-encrypt cannot parse: that line is left exactly as it is.
_amadeus_mac_encrypt_hooks=()
_amadeus_mac_encrypt_have_systemd=false
_amadeus_mac_encrypt_have_vconsole=false
_amadeus_mac_encrypt_have_encrypt=false
for _amadeus_mac_encrypt_hook in "${HOOKS[@]}"; do
  case $_amadeus_mac_encrypt_hook in
    systemd) _amadeus_mac_encrypt_have_systemd=true ;;
    sd-vconsole) _amadeus_mac_encrypt_have_vconsole=true ;;
    encrypt) _amadeus_mac_encrypt_have_encrypt=true ;;
  esac
done
if [[ $_amadeus_mac_encrypt_have_encrypt == false ]]; then
for _amadeus_mac_encrypt_hook in "${HOOKS[@]}"; do
  case $_amadeus_mac_encrypt_hook in
    udev)
      if [[ $_amadeus_mac_encrypt_have_systemd == false ]]; then
        _amadeus_mac_encrypt_hooks+=(systemd)
        _amadeus_mac_encrypt_have_systemd=true
      fi
      ;;
    keymap|consolefont)
      if [[ $_amadeus_mac_encrypt_have_vconsole == false ]]; then
        _amadeus_mac_encrypt_hooks+=(sd-vconsole)
        _amadeus_mac_encrypt_have_vconsole=true
      fi
      ;;
    *) _amadeus_mac_encrypt_hooks+=("$_amadeus_mac_encrypt_hook") ;;
  esac
done
if [[ $_amadeus_mac_encrypt_have_systemd == false ]]; then
  if [[ ${_amadeus_mac_encrypt_hooks[0]:-} == base ]]; then
    _amadeus_mac_encrypt_hooks=(base systemd "${_amadeus_mac_encrypt_hooks[@]:1}")
  else
    _amadeus_mac_encrypt_hooks=(systemd "${_amadeus_mac_encrypt_hooks[@]}")
  fi
fi
HOOKS=("${_amadeus_mac_encrypt_hooks[@]}")
_amadeus_mac_encrypt_hooks=()
_amadeus_mac_encrypt_have_ours=false
_amadeus_mac_encrypt_have_sd=false
_amadeus_mac_encrypt_added_ours=false
_amadeus_mac_encrypt_added_sd=false
for _amadeus_mac_encrypt_hook in "${HOOKS[@]}"; do
  if [[ $_amadeus_mac_encrypt_hook == amadeus-mac-encrypt ]]; then
    _amadeus_mac_encrypt_have_ours=true
  fi
  if [[ $_amadeus_mac_encrypt_hook == sd-encrypt ]]; then
    _amadeus_mac_encrypt_have_sd=true
  fi
done
for _amadeus_mac_encrypt_hook in "${HOOKS[@]}"; do
  if [[ $_amadeus_mac_encrypt_hook == sd-encrypt && $_amadeus_mac_encrypt_have_ours == false &&
        $_amadeus_mac_encrypt_added_ours == false ]]; then
    _amadeus_mac_encrypt_hooks+=(amadeus-mac-encrypt)
    _amadeus_mac_encrypt_added_ours=true
  fi
  if [[ $_amadeus_mac_encrypt_hook == filesystems ]]; then
    if [[ $_amadeus_mac_encrypt_have_ours == false && $_amadeus_mac_encrypt_added_ours == false ]]; then
      _amadeus_mac_encrypt_hooks+=(amadeus-mac-encrypt)
      _amadeus_mac_encrypt_added_ours=true
    fi
    if [[ $_amadeus_mac_encrypt_have_sd == false && $_amadeus_mac_encrypt_added_sd == false ]]; then
      _amadeus_mac_encrypt_hooks+=(sd-encrypt)
      _amadeus_mac_encrypt_added_sd=true
    fi
  fi
  _amadeus_mac_encrypt_hooks+=("$_amadeus_mac_encrypt_hook")
done
if [[ $_amadeus_mac_encrypt_have_ours == false && $_amadeus_mac_encrypt_added_ours == false ]]; then
  _amadeus_mac_encrypt_hooks+=(amadeus-mac-encrypt)
fi
if [[ $_amadeus_mac_encrypt_have_sd == false && $_amadeus_mac_encrypt_added_sd == false ]]; then
  _amadeus_mac_encrypt_hooks+=(sd-encrypt)
fi
HOOKS=("${_amadeus_mac_encrypt_hooks[@]}")
fi
unset _amadeus_mac_encrypt_hooks _amadeus_mac_encrypt_hook \
  _amadeus_mac_encrypt_have_ours _amadeus_mac_encrypt_have_sd \
  _amadeus_mac_encrypt_added_ours _amadeus_mac_encrypt_added_sd \
  _amadeus_mac_encrypt_have_systemd _amadeus_mac_encrypt_have_vconsole \
  _amadeus_mac_encrypt_have_encrypt
