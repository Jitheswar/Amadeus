# Check connectivity against an endpoint made for it instead of Arch's. It must
# stay plain HTTP so a captive portal can intercept it, and the network panel
# opens the same URL to reach the portal's sign-in page. archlinux.org is
# HSTS-preloaded for every subdomain, so browsers would force it to HTTPS;
# Ubuntu's connectivity check is plain HTTP by design. It answers 204 with
# "X-NetworkManager-Status: online", so no body is expected.
[connectivity]
uri=http://connectivity-check.ubuntu.com/
response=
